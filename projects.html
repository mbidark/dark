<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — MBI Dark · MD Ismail Hossen</title>
  <meta name="description" content="Selected works and projects by MD Ismail Hossen (MBI Dark) — web builds, YouTube films, and creative stories." />

  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MBI Dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SCROLL PROGRESS ===== -->
  <div id="scroll-progress"></div>

  <!-- ===== CURSOR ===== -->
  <div id="cursor-ring"></div>

  <!-- ===== PARTICLE CANVAS ===== -->
  <canvas id="particle-canvas"></canvas>

  <!-- ===== NOISE TEXTURE ===== -->
  <div class="bg-noise"></div>

  <!-- ===== NAVBAR ===== -->
  <header id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-flower">✿</span>"MʙɪㅤDᴀʀᴋ"
      </a>
      <nav class="nav-links">
        <a href="about.html" class="nav-link">About</a>
        <a href="projects.html" class="nav-link active-page">Projects</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
      <a href="MBI%20Dark%20CV.pdf" class="nav-cv" download="MBI-Dark-CV.pdf">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CV
      </a>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main>

    <!-- PAGE HERO -->
    <section class="page-hero project-hero">
      <div class="hero-radial-cyan"></div>
      <div class="hero-radial-violet"></div>
      <div class="page-hero-content reveal-hero">
        <span class="section-tag">// MY WORKS</span>
        <h1 class="page-hero-title">My <span class="grad">Projects</span></h1>
        <p class="page-hero-lede">Explore my creative journey and digital creations.</p>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section projects-section">
      <div class="container">
        <div class="projects-toolbar reveal">
          <div class="filter-btns" role="group" aria-label="Filter projects">
            <button class="filter-btn active" data-filter="all" aria-pressed="true">ALL PROJECTS</button>
            <button class="filter-btn" data-filter="web" aria-pressed="false">WEB</button>
            <button class="filter-btn" data-filter="social" aria-pressed="false">SOCIAL</button>
            <button class="filter-btn" data-filter="experiment" aria-pressed="false">EXPERIMENT</button>
          </div>
          <button id="projectMenuToggle" class="project-menu-toggle" type="button" aria-expanded="false" aria-controls="projectMenu">
            <span aria-hidden="true">☰</span>
            <span>Projects</span>
          </button>
          <button id="orbitPauseBtn" class="orbit-pause-btn" type="button" aria-pressed="false" title="Pause orbit">
            <span class="orbit-pause-icon" aria-hidden="true">Ⅱ</span>
            <span class="orbit-pause-text">Pause</span>
          </button>
        </div>

        <div class="projects-explorer">
          <aside class="project-menu" id="projectMenu" aria-label="Project directory">
            <div class="project-menu-heading">
              <div>
                <span class="section-tag">// DIRECTORY</span>
                <h2>Projects</h2>
              </div>
              <button id="projectMenuClose" class="project-menu-close" type="button" aria-label="Close project menu">×</button>
            </div>
            <div class="recent-projects" id="recentProjects"></div>
            <label class="project-menu-search" for="projectMenuSearch">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
              <input id="projectMenuSearch" type="search" placeholder="Search projects" autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <nav class="project-menu-list" id="projectMenuList" aria-label="All projects"></nav>
          </aside>

          <div class="projects-grid" id="projects-grid">
            <!-- Injected by JS -->
          </div>
        </div>
        <div class="projects-coming-soon" aria-label="More projects coming soon">
          <span></span>
          <p>MORE PROJECTS COMING SOON...</p>
          <span></span>
        </div>

      </div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer" id="site-footer"></footer>

  <!-- ===== BACK TO TOP ===== -->
  <button id="back-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- ===== KONAMI OVERLAY ===== -->
  <div id="konami-overlay">
    <div class="konami-content">
      <div class="konami-flower">✿</div>
      <h2>KONAMI CODE!</h2>
      <p>You found the secret!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
